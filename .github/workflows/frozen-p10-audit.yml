name: Frozen P10 Integrity and Smoke
on:
  push:
    branches:
      - "release/**"
      - "main"
  pull_request:

jobs:
  verify-crossscaleguard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned historical P10 dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-frozen-v3.txt
      - name: Verify all frozen P10 files and perform synthetic model inference
        run: |
          python our_defense/verify_frozen_release.py --smoke
